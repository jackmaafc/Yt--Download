<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local YouTube Downloader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>Local YouTube Downloader</h1>
                <p>Download videos and playlists directly to your computer.</p>
            </div>
            <button id="quit-btn" class="btn-secondary" style="background-color: #ffdddd; color: #d9534f; border: 1px solid #d9534f;">Quit App</button>
        </header>

        <section class="download-card">
            <textarea id="url-input" placeholder="Paste YouTube video or playlist URLs here (one per line)..." rows="4"></textarea>
            
            <div class="controls">
                <div class="control-group">
                    <label for="format-select">Format</label>
                    <select id="format-select">
                        <option value="video">Video (MP4)</option>
                        <option value="audio_m4a">Audio (M4A) - Instant</option>
                        <option value="audio_mp3">Audio (MP3) - Slower conversion</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="quality-select">Quality</label>
                    <select id="quality-select">
                        <option value="best">Best Available</option>
                        <option value="2160p">2160p (4K)</option>
                        <option value="1440p">1440p (2K)</option>
                        <option value="1080p">1080p</option>
                        <option value="720p">720p</option>
                        <option value="480p">480p</option>
                        <option value="360p">360p</option>
                    </select>
                </div>

                <div class="control-group save-path-group">
                    <label for="save-path">Save To</label>
                    <input type="text" id="save-path" value="{{ settings.save_path }}">
                </div>
            </div>

            <div class="settings-toggle">
                <label>
                    <input type="checkbox" id="use-defaults" {% if settings.use_defaults %}checked{% endif %}>
                    Use default settings for new downloads
                </label>
                <button id="save-defaults-btn" class="btn-secondary">Save Current as Defaults</button>
            </div>

            <button id="download-btn" class="btn-primary">Download</button>
        </section>

        <section class="queue-section">
            <div class="queue-header">
                <h2>Downloads Queue</h2>
                <button id="clear-completed-btn" class="btn-secondary btn-small">Clear Completed</button>
            </div>
            <div id="queue-container">
                <!-- Queue items will be injected here via JS -->
            </div>
        </section>
    </div>

    <script>
        // Init settings from server
        window.INITIAL_SETTINGS = {{ settings | tojson | safe }};
    </script>
    <script src="/static/script.js"></script>
</body>
</html>
